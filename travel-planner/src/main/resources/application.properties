spring.application.name=travel-planner

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/traveldb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=travel
spring.datasource.password=travel123

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Google Maps API Key
# 需在 Google Cloud Console 開啟：Geocoding API、Directions API
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
