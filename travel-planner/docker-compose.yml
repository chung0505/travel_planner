services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-planner-db
    environment:
      POSTGRES_DB: traveldb
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel123
    ports:
      - "5432:5432"
    volumes:
      - travel_pgdata:/var/lib/postgresql/data

volumes:
  travel_pgdata:
